name: Unit Tests

on: [pull_request]

env:
  SYMFONY_DEPRECATIONS_HELPER: weak

jobs:
  unit-test:
    name: Unit ( PHP ${{ matrix.versions.php }}, Symfony ${{ matrix.versions.symfony }}, Payum ${{ matrix.payum }} )
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # every PHP and Symfony pair runs against both payum/core 1.x and 2.x
        payum: [ '1.x', '2.x' ]
        versions:
          - { php: '8.1', symfony: '6.4.*' }
          - { php: '8.2', symfony: '6.4.*' }
          - { php: '8.2', symfony: '7.0.*' }
          - { php: '8.3', symfony: '7.0.*' }
          - { php: '8.4', symfony: '7.0.*' }
          - { php: '8.4', symfony: '8.0.*' }
          - { php: '8.5', symfony: '7.0.*' }
          - { php: '8.5', symfony: '8.0.*' }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.versions.php }}
          extensions: intl, opcache, mysql, pdo_mysql, :xdebug

      - name: Get composer cache directory
        id: composercache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composercache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.versions.php }}-composer-${{ hashFiles('composer.json composer.lock') }}
          restore-keys: ${{ runner.os }}-php-${{ matrix.versions.php }}-composer-

      - name: Install Symfony ${{ matrix.versions.symfony }}
        run: composer config extra.symfony.require ${{ matrix.versions.symfony }}

      - name: Install Symfony Flex
        run: |
          composer config --no-plugins allow-plugins.symfony/flex true
          composer require symfony/flex:"^1|^2" --no-update

      - name: Install Payum 2.x
        if: matrix.payum == '2.x'
        # the sub packages are part of the payum/payum monorepo from 2.0 on, so they cannot be
        # installed next to it
        #
        # 2.x-dev is a branch rather than a release, so the commit behind it moves without the
        # constraint moving with it. The cache is keyed on composer.json alone - composer.lock is not
        # committed - so a restored cache holds the branch at whichever commit it resolved to when
        # that cache was written, and the job silently tests against a payum/core from hours or days
        # ago. Dropping the cache costs one download and is what keeps the branch current.
        run: |
          composer clear-cache
          composer remove --dev --no-update payum/offline payum/stripe payum/paypal-express-checkout-nvp payum/omnipay-v3-bridge omnipay/common omnipay/dummy omnipay/paypal
          composer require --dev --no-update payum/payum:2.x-dev

      - name: Install dependencies
        run: composer update --prefer-source

      - name: Run unit tests
        run: bin/phpunit
